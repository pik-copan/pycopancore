[build-system]
requires = [
    "hatchling>=1.8.0",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "pycopancore"
dynamic = ["version"]
description = "Reference implementation of the copan:CORE World-Earth modelling framework"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "COPAN team @ PIK", email = "core@pik-potsdam.de" },
]
requires-python = ">=3.9"
keywords = ["ABM", "World-Earth models", "social-ecological systems", "copan:CORE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.11.0",
    "scipy>=0.17.0",
    "sympy>=1.0",
    "python-louvain>=0.9",
    "profilehooks",
    "numba",
]

[project.optional-dependencies]
dev = [
    "pytest>=4.6",
    "pytest-cov>=2.5.1",
    "pylama",
    "pylint",
    "pylama_pylint",
    "black",
    "flake8",
    "setuptools"  # Required for pylama's pkg_resources dependency
]

[project.urls]
Homepage = "https://github.com/pik-copan/pycopancore"
Issues = "https://github.com/pik-copan/pycopancore/issues"
Repository = "https://github.com/pik-copan/pycopancore"

[tool.aliases]
test = "pytest"
docs = "sphinx-build -b html ./docs ./docs/_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"
norecursedirs = [".git", ".cache", "build", "studies"]

[tool.black]
line-length = 79
target-version = ['py37', 'py38', 'py39', 'py310']
exclude = "pycopancore/_version.py"

[tool.flake8]
max-line-length = 79

[tool.hatch.version]
source = "vcs"
fallback_version = "0.8.3"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "pycopancore/_version.py"
template = "__version__ = '{version}'"
